# Expose the remote server through an existing Traefik instance.
#
# Layered on top of the base compose via the Makefile's -f chain, so the base
# file stays untouched. Only the AUTHENTICATED remote server is published —
# never the local workspaces app, which has no authentication and executes
# coding agents on the host. See docs/DEPLOYMENT.md.
#
# Required in .env.remote:
#   PUBLIC_HOSTNAME=agent.example.com
#   PUBLIC_BASE_URL=https://agent.example.com
#   TRAEFIK_NETWORK=<the docker network your Traefik is attached to>
#   TRAEFIK_CERTRESOLVER=<your ACME resolver name>
#   TRAEFIK_ENTRYPOINT=<your TLS entrypoint name>

services:
  remote-server:
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:?set TRAEFIK_NETWORK in .env.remote}
      traefik.http.routers.agentdeck.rule: Host(`${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME in .env.remote}`)
      traefik.http.routers.agentdeck.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.agentdeck.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.services.agentdeck.loadbalancer.server.port: "8081"

      # This host serves a password login form, so downgrade protection matters:
      # without HSTS every first visit is a plaintext HTTP round-trip that can be
      # intercepted before the redirect fires.
      #
      # `preload` is deliberately NOT set — submitting to the browser preload list
      # is effectively irreversible and would apply for months.
      traefik.http.routers.agentdeck.middlewares: agentdeck-security
      traefik.http.middlewares.agentdeck-security.headers.stsSeconds: "31536000"
      traefik.http.middlewares.agentdeck-security.headers.stsIncludeSubdomains: "true"
      traefik.http.middlewares.agentdeck-security.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.agentdeck-security.headers.referrerPolicy: strict-origin-when-cross-origin

  # The relay lets the remote UI reach workspaces running on your local machine.
  # It needs its own hostname: its routes live under /v1/relay/* and the remote
  # server already owns /v1, so a shared host would collide.
  relay-server:
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:?set TRAEFIK_NETWORK in .env.remote}
      traefik.http.routers.agentdeckrelay.rule: Host(`${RELAY_HOSTNAME:?set RELAY_HOSTNAME in .env.remote}`)
      traefik.http.routers.agentdeckrelay.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.agentdeckrelay.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.services.agentdeckrelay.loadbalancer.server.port: "8082"
      traefik.http.routers.agentdeckrelay.middlewares: agentdeck-security

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:?set TRAEFIK_NETWORK in .env.remote}
